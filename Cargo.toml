[package]
name = "OmoSlop"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gif = "0.14.2"
i-slint-backend-winit = "1.18.1"
image = "0.25.10"
notify-rust = "4.18.2"
pollster = "1.0.1"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = "1.0"
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"]}
raw-window-handle = "0.6"
winapi = { version = "0.3", features = ["winuser"] }
windows-sys = { version = "0.59", features = [ "Win32_UI_WindowsAndMessaging" ] }
webbrowser = "1.2.6"
ez-ffmpeg = "0.19.3"
 
[build-dependencies]
slint-build = "1.18.1" 

[profile.release]
codegen-units = 1
lto = true
