name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  VCPKGRS_TRIPLET: x64-windows
  VCPKGRS_DYNAMIC: "1"
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Full vcpkg history (нужна для builtin-baseline)
      shell: pwsh
      run: |
        if (Test-Path "$env:VCPKG_INSTALLATION_ROOT\.git\shallow") {
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --unshallow
        }
        exit 0

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

    - name: Install FFmpeg via vcpkg
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
          --triplet x64-windows `
          --x-manifest-root=. `
          --x-install-root="$env:VCPKG_INSTALLATION_ROOT\installed"

    - name: Set VCPKG_ROOT and PATH
      shell: pwsh
      run: |
        "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose --release

    - name: Collect exe and DLLs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Copy-Item target/release/OmoSlop.exe dist/
        Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" dist/

    - name: List dist
      shell: pwsh
      run: Get-ChildItem dist

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: OmoSlop
        path: dist/
